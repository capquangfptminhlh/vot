services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chovot
      POSTGRES_USER: chovot
      POSTGRES_PASSWORD: chovot_dev_password
    volumes: [chovot_pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U chovot -d chovot"], interval: 5s, timeout: 5s, retries: 20 }
  redis:
    image: redis:8-alpine
    command: ["redis-server","--appendonly","yes"]
    volumes: [chovot_redis:/data]
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: chovot_local, MINIO_ROOT_PASSWORD: chovot_local_secret_change_me }
    ports: ["9000:9000","9001:9001"]
    volumes: [chovot_minio:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh","-c","sleep 3; mc alias set local http://minio:9000 chovot_local chovot_local_secret_change_me; mc mb --ignore-existing local/chovot-private; mc mb --ignore-existing local/chovot-public; mc anonymous set download local/chovot-public"]
  api:
    build: ./backend
    env_file: ./backend/.env.example
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["3000:3000"]
volumes:
  chovot_pg:
  chovot_redis:
  chovot_minio:
