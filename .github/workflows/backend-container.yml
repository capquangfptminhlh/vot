name: ChoVot Backend Container

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-container.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-container.yml'

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build production API image
        run: docker build --pull --tag chovot-api:ci backend
      - name: Verify runtime artifact
        run: |
          docker run --rm --entrypoint sh chovot-api:ci -c 'test -f /app/dist/main.js && test -f /app/prisma/schema.prisma && test -f /app/package.json'
