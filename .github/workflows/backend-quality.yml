name: ChoVot Backend Quality

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-quality.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-quality.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chovot
          POSTGRES_USER: chovot
          POSTGRES_PASSWORD: chovot_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chovot -d chovot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start real object storage and create buckets
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d minio minio-init
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs minio minio-init
          exit 1

      - name: Prepare isolated backend test environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i 's/^NODE_ENV=.*/NODE_ENV=test/' .env
          sed -i 's/@postgres:5432/@127.0.0.1:5432/' .env
          sed -i 's#redis://redis:6379#redis://127.0.0.1:6379#' .env
          sed -i 's#http://minio:9000#http://127.0.0.1:9000#' .env

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Report production dependency audit
        shell: bash
        run: npm audit --omit=dev --audit-level=high || true

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Apply migrations to real PostgreSQL
        run: npm run prisma:migrate

      - name: Build Nest API
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Start API and wait for dependencies
        run: |
          node dist/main.js > /tmp/chovot-api.log 2>&1 &
          echo $! > /tmp/chovot-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/v1/ready > /tmp/ready.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chovot-api.log
          exit 1

      - name: Liveness and readiness smoke
        run: |
          curl -fsS http://127.0.0.1:3000/api/v1/health > /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(!h.ok || h.service!=='chovot-api') process.exit(1)"
          node -e "const r=require('/tmp/ready.json'); if(!r.ok || !r.dependencies?.database || !r.dependencies?.redis || !r.dependencies?.storage) process.exit(1)"

      - name: Auth, profile and listing lifecycle smoke
        run: |
          curl -fsS -X POST http://127.0.0.1:3000/api/v1/auth/otp/request \
            -H 'content-type: application/json' \
            -d '{"channel":"EMAIL","target":"ci@chovot.test"}' > /tmp/otp-request.json

          curl -fsS -X POST http://127.0.0.1:3000/api/v1/auth/otp/verify \
            -H 'content-type: application/json' \
            -d '{"channel":"EMAIL","target":"ci@chovot.test","code":"123456"}' > /tmp/login.json

          TOKEN=$(node -e "const x=require('/tmp/login.json'); if(!x.accessToken) process.exit(1); process.stdout.write(x.accessToken)")

          curl -fsS http://127.0.0.1:3000/api/v1/me \
            -H "authorization: Bearer $TOKEN" > /tmp/me.json
          node -e "const x=require('/tmp/me.json'); if(x.email!=='ci@chovot.test') process.exit(1)"

          curl -fsS -X POST http://127.0.0.1:3000/api/v1/listings \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $TOKEN" \
            -d '{"customBrand":"JOOLA","customModel":"Perseus","title":"JOOLA Perseus test CI","condition":"Like new 98-99%","priceVnd":4890000,"province":"TP.HCM"}' > /tmp/listing.json

          LISTING_ID=$(node -e "const x=require('/tmp/listing.json'); if(!x.id || x.status!=='DRAFT') process.exit(1); process.stdout.write(x.id)")

          STATUS=$(curl -sS -o /tmp/submit.json -w '%{http_code}' -X POST "http://127.0.0.1:3000/api/v1/listings/$LISTING_ID/submit" \
            -H "authorization: Bearer $TOKEN")
          test "$STATUS" = "403"
          grep -q 'SELLER_VERIFICATION_REQUIRED' /tmp/submit.json

      - name: Stop API and object storage
        if: always()
        working-directory: .
        run: |
          test -f /tmp/chovot-api.pid && kill $(cat /tmp/chovot-api.pid) || true
          cat /tmp/chovot-api.log || true
          docker compose logs minio minio-init || true
          docker compose stop minio || true
