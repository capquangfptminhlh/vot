name: Production App CI
on:
  push:
    branches: [production-next]
    paths:
      - 'production/**'
      - '.github/workflows/production-ci.yml'
  pull_request:
    paths:
      - 'production/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production/package.json
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
