name: ChoVot Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run ChoVot static audit
        run: python qa/site_audit.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find assets -type f -name '*.js' -print0)
      - name: Reject browser secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -REni '(service_role|SUPABASE_SERVICE_ROLE_KEY|sk_live_|sk-proj-)' assets --include='*.js'; then
            echo 'Secret-like token found in browser assets.' >&2
            exit 1
          fi
