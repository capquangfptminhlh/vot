name: Bootstrap Backend Generated Artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-backend-generated.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies for Prisma CLI
        run: npm install --no-audit --no-fund
      - name: Generate initial Prisma migration
        run: |
          mkdir -p prisma/migrations/20260912183000_init
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > prisma/migrations/20260912183000_init/migration.sql
          test -s prisma/migrations/20260912183000_init/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
      - name: Commit generated artifacts
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json backend/prisma/migrations
          git diff --cached --exit-code && exit 1 || true
          git commit -m "build: lock backend dependencies and initial migration"
          git push origin HEAD:main
